<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Desktop-only viewport: disable user pinch/Ctrl-wheel zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function () {
        var dpr = window.devicePixelRatio || 1;
        var boundedDpr = dpr > 1 ? Math.min(dpr, 2) : 1;

        /*
         * Windows WebView2 reports system display scaling through devicePixelRatio.
         * The app UI is mostly Tailwind/rem based, so counter-scaling the root font
         * keeps the desktop shell at a stable physical size on 125%-200% displays.
         *
         * This is the DPI baseline: divide by the full dpr so system scaling is
         * fully cancelled (125%→12.8px, 150%→10.7px), with a 10px floor so 200%
         * never becomes unreadable. The user-facing zoom multiplies this baseline.
         *
         * Read the persisted zoomLevel here — on the very first frame, before React
         * mounts — so the initial paint already reflects the user's preference.
         * Otherwise the baseline-only value flashes briefly and the app looks like
         * it "forgot" the zoom setting until useZoomLevel() runs in an effect.
         * The zustand persist shape is { state: { zoomLevel }, version } under the
         * 'winterm-settings' localStorage key.
         *
         * Do not use CSS zoom or transform here: xterm selection and pointer hit
         * testing depend on unscaled DOM coordinates.
         */
        var zoomLevel = 1.0;
        try {
          var raw = localStorage.getItem('winterm-settings');
          if (raw) {
            var persisted = JSON.parse(raw);
            var stored = persisted && persisted.state && persisted.state.zoomLevel;
            if (typeof stored === 'number' && !isNaN(stored)) {
              zoomLevel = Math.max(0.5, Math.min(2.0, stored));
            }
          }
        } catch (e) { /* ignore malformed persisted state */ }

        var baseline = Math.max(10, 16 / boundedDpr);
        document.documentElement.style.fontSize = baseline * zoomLevel + 'px';
      })();
    </script>
    <title>WinTerm</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Static CSS: loaded directly via <link> for WebKitGTK compatibility.
         Vite's JS-based style injection doesn't work reliably in WebKitGTK. -->
    <link rel="stylesheet" href="/static.css" />
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
