<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Desktop-only viewport: disable user pinch/Ctrl-wheel zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function () {
        var dpr = window.devicePixelRatio || 1;

        if (dpr > 1) {
          var boundedDpr = Math.min(dpr, 2);

          /*
           * Windows WebView2 reports system display scaling through devicePixelRatio.
           * The app UI is mostly Tailwind/rem based, so counter-scaling the root font
           * keeps the desktop shell at a stable physical size on 125%-200% displays.
           *
           * Do not use CSS zoom or transform here: xterm selection and pointer hit
           * testing depend on unscaled DOM coordinates.
           */
          document.documentElement.style.fontSize = 16 / Math.sqrt(boundedDpr) + 'px';
        }
      })();
    </script>
    <title>WinTerm</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Static CSS: loaded directly via <link> for WebKitGTK compatibility.
         Vite's JS-based style injection doesn't work reliably in WebKitGTK. -->
    <link rel="stylesheet" href="/static.css" />
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
